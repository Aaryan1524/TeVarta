name: Backend contract

on:
  pull_request:
  push:
    branches: [main, Aaditya]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check backend
      - run: PYTHONPATH=backend python scripts/export_openapi.py
      - run: git diff --exit-code -- contracts/v1/openapi.json
      - run: python -m pytest

  required-check-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/verify_required_checks.sh
