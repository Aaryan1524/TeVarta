name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        # On private repositories without GitHub Advanced Security (GHAS), the
        # Dependency Review API is unavailable. continue-on-error allows PR checks
        # to pass on personal/private repositories while still executing if GHAS
        # or public repository settings are active. Dependabot (.github/dependabot.yml)
        # provides baseline dependency vulnerability scanning per MVP §20.2.
        uses: actions/dependency-review-action@v4
        continue-on-error: true
