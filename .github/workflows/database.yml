name: Database

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tevarta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tevarta_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEVARTA_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/tevarta_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check backend migrations
      - run: make database-test PYTHON=python
