[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tevarta-api"
version = "0.1.0"
description = "Te Varta API and worker foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "neo4j>=5.26,<6",
  "pydantic>=2.9,<3",
  "PyJWT[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
markers = [
  "database: integration tests using disposable PostgreSQL databases",
  "neo4j: integration tests using a disposable Neo4j database",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
