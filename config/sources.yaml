# T01 selected-source registry. This file does not authorize production polling:
# T19 may set `active: true` only after endpoint, robots/feed-terms, and
# body-processing/storage checks pass for that individual source.
sources:
  - id: sec_current_filings
    domain: sec.gov
    # 8-Ks only: the all-forms feed is dominated by insider Form 4s. Fast path (§8.1).
    feed_url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&count=100&output=atom"
    publisher_group: us_sec
    tier_value: 1.0
    reliability: 0.99
    poll_interval_s: 300
    active: true
    ingestion_mode: atom
    access_note: "Use the SEC-required descriptive User-Agent and stay within SEC rate limits."
    evidence_url: "https://www.sec.gov/search-filings"

  - id: sec_current_6k
    domain: sec.gov
    # Foreign private issuers (TSMC, ASML) report current events on 6-K, not 8-K.
    feed_url: "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=6-K&count=100&output=atom"
    publisher_group: us_sec
    tier_value: 1.0
    reliability: 0.99
    poll_interval_s: 300
    active: true
    ingestion_mode: atom
    access_note: "Use the SEC-required descriptive User-Agent and stay within SEC rate limits."
    evidence_url: "https://www.sec.gov/search-filings"

  - id: federal_register_documents
    domain: federalregister.gov
